# WyrmWoodWilds feature toggles.
# Format:  ModFolder=on|off
# Order in this file is the RuneSchema load order.
# After editing run: ./tools/sync-mods.sh (or ./tools/toggle.sh <Name> on|off)
#
# Phase 1 - data-only
WW_CarryWeight=on
WW_Storage=on
WW_SpellCooldowns=on
WW_RespawnFishing=on
WW_RespawnRuneEssence=on
WW_RespawnAnimaVents=on
WW_RespawnMinerals=off
#
# Phase 1 - building
WW_BuildingStability=on
WW_BuildPlacement=on
WW_BuildHeight=on
