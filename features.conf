WW_Storage=on
WW_StorageUI=on
WW_SpellCooldowns=on
WW_SpellAreas=on
WW_RaidPace=on
WW_RespawnFishing=on
WW_RespawnRuneEssence=on
WW_RespawnAnimaVents=on
WW_RespawnMinerals=off
#
# Phase 1 - building
WW_BuildingStability=on
WW_BuildingDurability=on
WW_BuildPlacement=on
WW_BuildHeight=on
